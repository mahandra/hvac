<div id="share-panel" class="card card-body">
  {% if share_url %}
  <label for="share-url" class="form-label">Read-only link (no login required)</label>
  <div class="input-group mb-2">
    <input type="text" id="share-url" class="form-control" value="{{ share_url }}" readonly>
    <button type="button" class="btn btn-outline-primary" data-copy-target="#share-url">Copy</button>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <form method="post" action="{% url 'share_manage' property.pk %}" hx-post="{% url 'share_manage' property.pk %}"
          hx-target="#share-panel" hx-swap="outerHTML" hx-confirm="Replace the link? The old link will stop working.">
      {% csrf_token %}<input type="hidden" name="action" value="regenerate">
      <button type="submit" class="btn btn-outline-secondary">Regenerate</button>
    </form>
    <form method="post" action="{% url 'share_manage' property.pk %}" hx-post="{% url 'share_manage' property.pk %}"
          hx-target="#share-panel" hx-swap="outerHTML" hx-confirm="Disable the share link?">
      {% csrf_token %}<input type="hidden" name="action" value="disable">
      <button type="submit" class="btn btn-outline-danger">Disable link</button>
    </form>
  </div>
  {% else %}
  <p class="mb-2">No share link is active. Generate a read-only link for this property.</p>
  <form method="post" action="{% url 'share_manage' property.pk %}" hx-post="{% url 'share_manage' property.pk %}"
        hx-target="#share-panel" hx-swap="outerHTML">
    {% csrf_token %}<input type="hidden" name="action" value="create">
    <button type="submit" class="btn btn-primary">Generate link</button>
  </form>
  {% endif %}
</div>
