{% extends "base.html" %}
{% block title %}Log in · AC Maintenance{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<div class="login-card card shadow-sm mx-auto">
  <div class="card-body">
    <h1 class="h4 mb-3">Log in</h1>
    {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control form-control-lg"
               autocomplete="username" autocapitalize="none" required autofocus
               value="{{ form.username.value|default:'' }}">
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control form-control-lg"
               autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary btn-lg w-100">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
