[project]
name = "hvac-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=27.0.1",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.9",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tracker/tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
